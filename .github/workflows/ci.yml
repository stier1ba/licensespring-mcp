name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (100% coverage required)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Check for API secrets
        id: check-secrets
        env:
          LICENSE_API_KEY: ${{ secrets.LICENSE_API_KEY }}
          MANAGEMENT_API_KEY: ${{ secrets.MANAGEMENT_API_KEY }}
        run: |
          if [ -n "$LICENSE_API_KEY" ] || [ -n "$MANAGEMENT_API_KEY" ]; then
            echo "secrets-available=true" >> "$GITHUB_OUTPUT"
          else
            echo "secrets-available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Live integration checks (read-only)
        if: steps.check-secrets.outputs.secrets-available == 'true' && matrix.node-version == '22.x'
        run: node tests/integration.mjs
        env:
          LICENSE_API_KEY: ${{ secrets.LICENSE_API_KEY }}
          LICENSE_SHARED_KEY: ${{ secrets.LICENSE_SHARED_KEY }}
          LICENSE_CLIENT_ID: ${{ secrets.LICENSE_CLIENT_ID }}
          LICENSE_CLIENT_SECRET: ${{ secrets.LICENSE_CLIENT_SECRET }}
          MANAGEMENT_API_KEY: ${{ secrets.MANAGEMENT_API_KEY }}

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
