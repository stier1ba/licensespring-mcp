name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (100% coverage enforced)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Stdio smoke tests (built binaries + mock HTTP server)
        run: npm run test:smoke

      - name: Live integration tests (skipped without secrets)
        run: npm run test:integration
        env:
          LICENSE_API_KEY: ${{ secrets.LICENSE_API_KEY }}
          LICENSE_SHARED_KEY: ${{ secrets.LICENSE_SHARED_KEY }}
          LICENSE_CLIENT_ID: ${{ secrets.LICENSE_CLIENT_ID }}
          LICENSE_CLIENT_SECRET: ${{ secrets.LICENSE_CLIENT_SECRET }}
          MANAGEMENT_API_KEY: ${{ secrets.MANAGEMENT_API_KEY }}
          LS_TEST_PRODUCT: ${{ vars.LS_TEST_PRODUCT }}
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies only: dev-tooling advisories (semantic-release, jest)
      # have no non-breaking fix and never ship in the published package.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
