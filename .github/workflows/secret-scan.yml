# Blocks new credentials from landing in this repo.
# Scans only the commits a pull request or push adds, so existing history
# does not fail the build. Run it manually ("Run workflow") with
# full_history=true for a complete audit.
#
# False positive in a test fixture? Add `# gitleaks:allow` (or `// gitleaks:allow`)
# at the end of that line, or add its fingerprint to .gitleaksignore.
name: Secret scan

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan the entire git history instead of only new commits
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # Built from source at a pinned version (verified by the Go checksum
      # database), so no third-party action or license key is needed.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FULL: ${{ inputs.full_history }}
        run: |
          set -euo pipefail
          GL="$(go env GOPATH)/bin/gitleaks"
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}..HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${AFTER}"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL" = "true" ]; then
            RANGE="--all"
          else
            RANGE="-1 ${AFTER}"
          fi
          echo "Scanning: git log ${RANGE}"
          "$GL" git . --log-opts="${RANGE}" --redact --verbose --no-banner --exit-code 1
